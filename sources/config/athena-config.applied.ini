# ==============================================================================
# ATHENA.LAN (Ryzen 9 5900X + RX 5500 XT 8GB + 128GB RAM)
# Tuned 2026-08-26: aliases, parallel 4, embeddings preset.
# 2026-11-24: parallel 4 -> 1 and default ctx 8192 -> 16384. The 4-way split
# left 2048 tokens per request, so any editor or agent request longer than
# 2048 tokens failed with "exceeds the available context size" (verified
# 2026-11-24: a 3034-token prompt returned HTTP 400). The router is used for
# chat and agent work, not only FIM, so it now serves one full conversation
# context at a time. FIM still runs on its own single-model server (:8012).
# Baseline: /usr/local/etc/config.ini.bak-20260826, .bak-20261124-parallel1
# ==============================================================================
[*]
load-mode = mmap
fit = on
ctx-size = 16384
flash-attn = true
threads = 12
parallel = 1
cache-reuse = 256
cache-type-k = q8_0
cache-type-v = q8_0

# --- GPU MODELS (100% VRAM offload on RX 5500 XT) ---
[Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q8_0]
alias = coder15
ngl = 99
temp = 0.2
top-p = 0.95

[Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q8_0]
alias = coder3
ngl = 99
temp = 0.2
top-p = 0.95

[unsloth/Llama-3.2-3B-Instruct-GGUF:Q8_0]
alias = llama3
ngl = 99
temp = 0.6
top-p = 0.9

[unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL]
alias = gemma-e4
ngl = 99
temp = 0.7
# 2026-11-24: the projection file is already in the cache, but without it the
# router advertises "image" and "audio" in /v1/models and then rejects every
# image request with "Failed to load image or audio file". Naming it here makes
# the advertised capability real. Verified 2026-11-24 on athena: an image
# request returns "The image is a solid red color." The path is a cache
# snapshot; refresh it when the model is re-downloaded.
mmproj = /home/preston/.cache/huggingface/hub/models--unsloth--gemma-4-E4B-it-qat-GGUF/snapshots/8c5a9e4fd5482e2be20fe0bf013b4c262a8f4265/mmproj-BF16.gguf

# --- Qwen3.8-27B (GPU+CPU split: 16 GB Q4 on the 8 GB RX 5500 XT) ---
[batiai/Qwen3.8-27B-GGUF:Q4_K_M]
alias = qwen27
ctx-size = 16384
flash-attn = false
cache-type-v = f16
temp = 0.6
top-p = 0.95

# --- EMBEDDINGS (RAG) ---
[ggml-org/Nomic-Embed-Text-V2-GGUF:Q8_0]
embeddings = on
alias = nomic-embed

# --- CPU FALLBACK MODELS (Runs in 128 GB System RAM if beast is offline) ---
[Qwen/Qwen2.5-Coder-32B-Instruct-GGUF:Q4_K_M]
alias = coder32-fallback
ngl = 0
ctx-size = 16384
temp = 0.2
top-p = 0.95

# 2026-11-24: the preset key asked for UD-Q4_K_XL, but the cache holds only
# Q4_K_M, so the child server failed to load ("failed to load model ''",
# verified 2026-11-24). The key names the quant that is actually on disk.
[unsloth/DeepSeek-R1-Distill-Qwen-32B-GGUF:Q4_K_M]
alias = r1-32b-fallback
ngl = 0
ctx-size = 16384
temp = 0.6
top-p = 0.95
