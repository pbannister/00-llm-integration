# ==============================================================================
# ATHENA.LAN (Ryzen 9 5900X + RX 5500 XT 8GB + 128GB RAM)
# Tuned 2026-08-26: aliases, parallel 4, embeddings preset.
# Baseline: /usr/local/etc/config.ini.bak-20260826
# ==============================================================================
[*]
mmap = 1
fit = on
ctx-size = 8192
flash-attn = true
threads = 12
parallel = 4

# --- GPU MODELS (100% VRAM offload on RX 5500 XT) ---
[Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q8_0]
alias = coder15
ngl = 99
temp = 0.2
top-p = 0.95

[Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q8_0]
alias = coder3
ngl = 99
temp = 0.2
top-p = 0.95

[unsloth/Llama-3.2-3B-Instruct-GGUF:Q8_0]
alias = llama3
ngl = 99
temp = 0.6
top-p = 0.9

[unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL]
alias = gemma-e4
ngl = 99
temp = 0.7

# --- EMBEDDINGS (RAG) ---
[ggml-org/Nomic-Embed-Text-V2-GGUF:Q8_0]
embeddings = on
alias = nomic-embed

# --- CPU FALLBACK MODELS (Runs in 128 GB System RAM if beast is offline) ---
[Qwen/Qwen2.5-Coder-32B-Instruct-GGUF:Q4_K_M]
alias = coder32-fallback
ngl = 0
ctx-size = 16384
temp = 0.2
top-p = 0.95

[unsloth/DeepSeek-R1-Distill-Qwen-32B-GGUF:UD-Q4_K_XL]
alias = r1-32b-fallback
ngl = 0
ctx-size = 16384
temp = 0.6
top-p = 0.95
