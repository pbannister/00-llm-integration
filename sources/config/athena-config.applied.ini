# ==============================================================================
# ATHENA.LAN (Ryzen 9 5900X + RX 5500 XT 8GB + 128GB RAM)
# Tuned 2026-08-26: aliases, parallel 4, embeddings preset.
# qwen27 (Qwen3.8-27B, GPU+CPU split) added 2026-09-03; llama.cpp build 10776
# live (GPU enabled in the service unit; forced chat-template removed).
# Baselines: config.ini.bak-20260826, config.ini.bak-20260903.
# See records/2026-09-03-01-athena-gpu-fixes-qwen27-llamacpp-current.md.
# ==============================================================================
[*]
mmap = 1
fit = on
ctx-size = 8192
flash-attn = true
threads = 12
parallel = 4
cache-reuse = 256
cache-type-k = q8_0
cache-type-v = q8_0

# --- GPU MODELS (100% VRAM offload on RX 5500 XT) ---
[Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q8_0]
alias = coder15
ngl = 99
temp = 0.2
top-p = 0.95

[Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q8_0]
alias = coder3
ngl = 99
temp = 0.2
top-p = 0.95

[unsloth/Llama-3.2-3B-Instruct-GGUF:Q8_0]
alias = llama3
ngl = 99
temp = 0.6
top-p = 0.9

[unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL]
alias = gemma-e4
ngl = 99
temp = 0.7

# --- Qwen3.8-27B (GPU+CPU split: 16 GB Q4 on the 8 GB RX 5500 XT) ---
[batiai/Qwen3.8-27B-GGUF:Q4_K_M]
alias = qwen27
ctx-size = 16384
flash-attn = false
cache-type-v = f16
temp = 0.6
top-p = 0.95

# --- EMBEDDINGS (RAG) ---
[ggml-org/Nomic-Embed-Text-V2-GGUF:Q8_0]
embeddings = on
alias = nomic-embed

# --- CPU FALLBACK MODELS (Runs in 128 GB System RAM if beast is offline) ---
[Qwen/Qwen2.5-Coder-32B-Instruct-GGUF:Q4_K_M]
alias = coder32-fallback
ngl = 0
ctx-size = 16384
temp = 0.2
top-p = 0.95

[unsloth/DeepSeek-R1-Distill-Qwen-32B-GGUF:UD-Q4_K_XL]
alias = r1-32b-fallback
ngl = 0
ctx-size = 16384
temp = 0.6
top-p = 0.95
