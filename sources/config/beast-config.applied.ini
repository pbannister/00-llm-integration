# ==============================================================================
# BEAST (MI25 16 GB VRAM + Dual Xeon 256 GB RAM)
# Tuned 2026-08-26 (aliases, parallel 4); GPU-preset stability change 2026-09-02
# (flash-attn off, V f16, fit-trimmed - records/2026-09-02-01). 2026-09-03:
# op-offload=false on CPU presets (PCIe prefill fix); gemma-26b ctx 8192 +
# load-mode none (GPU-resident); qwen38 GPU-fit. See records/2026-09-03-03.
# Baselines: config.ini.bak-20260826, .bak-20260902, .bak-20260903-opoffload.
# ==============================================================================
[*]
mmap = 1
fit = on
ctx-size = 32768
flash-attn = true
parallel = 4
cache-reuse = 256
cache-type-k = q8_0
cache-type-v = q8_0

# --- GPU MODELS (16 GB MI25) ---
[Qwen/Qwen2.5-Coder-32B-Instruct-GGUF:Q4_K_M]
alias = coder32
ctx-size = 16384
flash-attn = false
temp = 0.2
top-p = 0.95

cache-type-v = f16
[bartowski/Qwen2.5-Coder-14B-Instruct-GGUF:Q4_K_M]
alias = coder14
ctx-size = 16384
temp = 0.2
top-p = 0.95

flash-attn = false
cache-type-v = f16
[unsloth/Qwen3.5-9B-GGUF:Q4_K_M]
alias = qwen9
ctx-size = 32768
temp = 0.6
top-p = 0.95

flash-attn = false
cache-type-v = f16
[unsloth/gpt-oss-20b-GGUF:UD-Q4_K_XL]
alias = gpt-oss-20b
ctx-size = 32768
temp = 0.6
top-p = 0.95

flash-attn = false
cache-type-v = f16
[unsloth/gemma-4-12B-it-qat-GGUF:Q4_K_XL]
alias = gemma-12b
cache-type-v = f16
ctx-size = 32768
temp = 0.7

flash-attn = false
[unsloth/Devstral-Small-2-24B-Instruct-2512-GGUF:Q4_K_M]
alias = devstral
temp = 0.15
top-p = 0.95

flash-attn = false
cache-type-v = f16
[unsloth/DeepSeek-R1-Distill-Qwen-14B-GGUF:UD-Q4_K_XL]
alias = r1-14b
temp = 0.6
top-p = 0.95

flash-attn = false
cache-type-v = f16
[unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL]
alias = gemma-26b
cache-type-v = f16
flash-attn = false
temp = 0.7
ctx-size = 8192

# --- CPU HEAVYWEIGHTS (Dual Xeon NUMA) ---
load-mode = none
[unsloth/gpt-oss-120b-GGUF:UD-Q4_K_XL]
alias = gpt-oss-120b
op-offload = false
ngl = 0
numa = distribute
ctx-size = 65536
temp = 0.2
jinja = true

[unsloth/DeepSeek-R1-Distill-Llama-70B-GGUF:UD-Q4_K_XL]
alias = r1-70b
op-offload = false
ngl = 0
numa = distribute
temp = 0.6
top-p = 0.95

[unsloth/Llama-3.3-70B-Instruct-GGUF:UD-Q4_K_XL]
alias = llama70
op-offload = false
ngl = 0
numa = distribute
temp = 0.6
top-p = 0.9


# --- Qwen3.8-Flash-Next (CPU heavyweight; llama.cpp qwen4exp support required) ---
[batiai/Qwen3.8-Flash-Next-GGUF:Q4_K_M]
alias = qwen38
ctx-size = 16384
flash-attn = false
cache-type-v = f16
op-offload = false
temp = 0.6
top-p = 0.95
jinja = true
