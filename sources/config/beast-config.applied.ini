# ==============================================================================
# BEAST (MI25 16 GB VRAM + Dual Xeon 256 GB RAM)
# Tuned 2026-08-26: aliases, parallel 4, promoted GPU presets.
# GPU-preset stability change 2026-09-02: flash-attn off, cache-type-v f16,
# explicit ngl dropped (fit trims layers to 16 GiB VRAM) after recurring MI25
# ring timeouts / Vulkan device loss. Baseline: config.ini.bak-20260902.
# See records/2026-09-02-01-mi25-vulkan-device-lost-tuning.md.
# qwen38 CPU preset (batiai Qwen3.8-Flash-Next Q4_K_M) added 2026-09-02;
# llama.cpp rebuilt to build 10790 (qwen4exp support) same day. Baselines:
# config.ini.bak-20260902-qwen38. See records/2026-09-02-02-....md.
# ==============================================================================
[*]
mmap = 1
fit = on
ctx-size = 32768
flash-attn = true
parallel = 4
cache-reuse = 256
cache-type-k = q8_0
cache-type-v = q8_0

# --- GPU MODELS (16 GB MI25) ---
[Qwen/Qwen2.5-Coder-32B-Instruct-GGUF:Q4_K_M]
alias = coder32
ctx-size = 16384
flash-attn = false
temp = 0.2
top-p = 0.95

cache-type-v = f16
[bartowski/Qwen2.5-Coder-14B-Instruct-GGUF:Q4_K_M]
alias = coder14
ctx-size = 16384
temp = 0.2
top-p = 0.95

flash-attn = false
cache-type-v = f16
[unsloth/Qwen3.5-9B-GGUF:Q4_K_M]
