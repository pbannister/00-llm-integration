# ==============================================================================
# BEAST (MI25 16 GB VRAM + Dual Xeon 251 GB RAM)
# Tuned 2026-08-26; GPU-preset stability 2026-09-02 (FA off, V f16, fit);
# 2026-09-03: op-offload=false on CPU presets; gemma-26b ctx 81920 (KV spills to CPU); GPU parallel=1;
# qwen38 GPU-fit; cache trimmed (coder32/devstral/llama70/r1-70b/r1-14b/E2B/E4B
# removed). See records/2026-09-03-01..03. Baselines: config.ini.bak-20260903-*.
# ==============================================================================
[*]
load-mode = mmap
fit = on
ctx-size = 32768
flash-attn = true
parallel = 1
cache-reuse = 256
cache-type-k = q8_0
cache-type-v = q8_0

# --- GPU MODELS (16 GB MI25; one GPU-resident model at a time) ---
[bartowski/Qwen2.5-Coder-14B-Instruct-GGUF:Q4_K_M]
alias = coder14
ctx-size = 16384
flash-attn = false
cache-type-v = f16
temp = 0.2
top-p = 0.95

[unsloth/Qwen3.5-9B-GGUF:Q4_K_M]
alias = qwen9
ctx-size = 32768
flash-attn = false
cache-type-v = f16
temp = 0.6
top-p = 0.95

[unsloth/gpt-oss-20b-GGUF:UD-Q4_K_XL]
alias = gpt-oss-20b
ctx-size = 32768
flash-attn = false
cache-type-v = f16
temp = 0.6
top-p = 0.95

[unsloth/gemma-4-12B-it-qat-GGUF:Q4_K_XL]
alias = gemma-12b
ctx-size = 32768
flash-attn = false
cache-type-v = f16
temp = 0.7

[unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL]
alias = gemma-26b
ctx-size = 81920
flash-attn = false
cache-type-v = f16
temp = 0.7

# --- Qwen3.8-Flash-Next: REMOVED from the router 2026-11-24 ---
# Policy has never approved this model: at 111 GiB it cannot fit the 16 GiB
# MI25, and every measured offload configuration was worse than CPU-only
# (records/2026-09-21-01-mi25-inference-benchmarks.md). Listing it on the
# router invited clients to select it, and each such request paid a ~18 s
# load for a model the policy does not recommend. The weights stay in the
# cache; re-add this section only with a new benchmark that beats the
# alternative. See documents/10-routing-policy.md.

