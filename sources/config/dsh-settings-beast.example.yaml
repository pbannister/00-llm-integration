# DeepSeek Harness `llm-pi-ai` provider sections for the local routers.
#
# Target: ~/.dsh/settings.yaml — merge these sections under the existing keys.
# The adapter re-reads the section per request; no restart is needed.
# Credentials: store any non-empty value under BEAST_API_KEY (and ATHENA_API_KEY)
# via the DSH Models settings (writes ~/.dsh/.credentials.yaml), or export them
# in the dsh launch environment. llama.cpp ignores Authorization until a router
# runs with --api-key; if that is added, use the same values here.
#
# Facts verified 2026-09-25 from dataflow.in/endpoints/ (re-checked after the
# 2026-09-03 cache trim; aliases and contexts unchanged). Ids are the router
# ALIASES, which now exist on the live routers. contextWindow matches each
# preset's ctx-size; maxTokens sits well under it. Bare id-only entries inherit
# 262144/32768 defaults that exceed every preset — do not use them.
#
# The nomic-embed model (athena) is intentionally NOT listed here: it serves
# /v1/embeddings on the router, and DSH is a chat/agent harness. Call
# http://athena.lan:2001/v1/embeddings directly for RAG.

llm-pi-ai:
  providers:
    beast:
      displayName: Beast (llama.cpp)
      apiKeyEnv: BEAST_API_KEY
      api: openai-completions
      baseURL: http://beast.lan:2001/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        # --- GPU-resident (fast, interactive; one GPU model at a time on :2001) ---
        - id: coder14
          contextWindow: 16384
          maxTokens: 8192
        - id: qwen9
          contextWindow: 32768
          maxTokens: 8192
        - id: gpt-oss-20b
          contextWindow: 32768
          maxTokens: 8192
        - id: gemma-12b
          contextWindow: 32768
          maxTokens: 8192
        # --- large context (KV spills to CPU beyond GPU capacity) ---
        - id: gemma-26b
          contextWindow: 81920
          maxTokens: 16384
        # --- Flagship (GPU-fit: ~14 of 111 GiB on the MI25) ---
        - id: qwen38
          contextWindow: 16384
          maxTokens: 8192
    beast-cpu:
      displayName: Beast CPU (llama.cpp :2002)
      apiKeyEnv: BEAST_API_KEY
      api: openai-completions
      baseURL: http://beast.lan:2002/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        # --- CPU-heavyweight (system RAM, numa distribute) ---
        - id: gpt-oss-120b
          contextWindow: 65536
          maxTokens: 16384
    athena:
      displayName: Athena (llama.cpp)
      apiKeyEnv: ATHENA_API_KEY
      api: openai-completions
      baseURL: http://athena.lan:2001/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        # --- GPU-resident small models (this desktop; lowest latency) ---
        - id: coder15
          contextWindow: 8192
          maxTokens: 4096
        - id: coder3
          contextWindow: 8192
          maxTokens: 4096
        - id: llama3
          contextWindow: 8192
          maxTokens: 4096
        - id: gemma-e4
          contextWindow: 8192
          maxTokens: 4096
        # --- CPU fallback (beast offline) ---
        - id: coder32-fallback
          contextWindow: 16384
          maxTokens: 8192
        - id: r1-32b-fallback
          contextWindow: 16384
          maxTokens: 8192

# Switch the default agent model with the GUI model picker (leave reasoning
# effort off for local models), or set:
# agent-default-model:
#   provider: beast
#   model: coder14
